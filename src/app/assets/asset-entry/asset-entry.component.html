<form class="form-horizontal" autocomplete="off" #entryModal="ngForm" (ngSubmit)="save()">
    <abp-modal-header title="Create/Edit Asset" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body">
        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="name">Purchase Date</label>
            <div class="col-md-9">
                <p-datepicker [(ngModel)]="date" [ngModelOptions]="{standalone: true}" [readonlyInput]="true" dateFormat="dd/M/yy" [showIcon]="true"  />
            </div>
        </div>

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="name">Name</label>
            <div class="col-md-9">
                <input type="text" class="form-control" name="name" id="name" required [(ngModel)]="model.name"
                    #nameModel="ngModel" #nameEl />
                <abp-validation-summary [control]="nameModel" [controlEl]="nameEl"></abp-validation-summary>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="description">Description</label>
            <div class="col-md-9">
                <input type="text" class="form-control" name="description" id="description" [(ngModel)]="model.description" placeholder="Write brand name, quality etc here"/>
            </div>
        </div>

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="uc"> Used Condition </label>
            <div class="col-md-9">
                <select class="form-select form-control" name="uc" id="uc" #ucModel="ngModel"
                    #ucEl [(ngModel)]="model.condition" required>
                    <option *ngFor="let uc of usedConditions" [value]="uc.value">{{uc.displayText}}
                    </option>
                </select>
                <abp-validation-summary [control]="ucModel"
                    [controlEl]="ucEl"></abp-validation-summary>
            </div>
        </div>

         <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="value">Value</label>
            <div class="col-md-9">
                <input type="number" class="form-control" name="value" id="value" required [(ngModel)]="model.value"
                    #valueModel="ngModel" #valueEl />
                <abp-validation-summary [control]="valueModel" [controlEl]="valueEl"></abp-validation-summary>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="remarks">Remarks</label>
            <div class="col-md-9">
                <input type="text" class="form-control" name="remarks" id="remarks" [(ngModel)]="model.remarks" />
            </div>
        </div>

    </div>
    <abp-modal-footer [cancelDisabled]="saving" [saveDisabled]="!entryModal.form.valid || saving"
        (onCancelClick)="bsModalRef.hide()"></abp-modal-footer>
</form>
