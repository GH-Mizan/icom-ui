<div [@routerTransition]>
    <section class="content-header">
        <div class="container-fluid">
            <div class="row">
                <div class="col-6">
                    <h1>Collections</h1>
                </div>
                <div class="col-6 text-right">

                </div>
            </div>
        </div>
    </section>
    <section class="content px-2 pb-3">
        <div class="container-fluid">
            <div class="card table-wrapper">
                <div class="card-header">
                    <div class="row">
                        <div class="col-md-3">
                            <p-datepicker [(ngModel)]="startDate" [readonlyInput]="true" dateFormat="dd/M/yy"
                                [showIcon]="true" />
                        </div>
                        <div class="col-md-3">
                            <p-datepicker [(ngModel)]="endDate" [readonlyInput]="true" dateFormat="dd/M/yy"
                                [showIcon]="true" />
                        </div>
                        <div class="col-md-3">

                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-primary" (click)="list()">Search</button>
                        </div>
                    </div>

                </div>
                <div class="card-body table-responsive table-striped table-bordered">
                    <!--<Primeng-TurboTable-Start>-->
                    <div class="primeng-datatable-container">
                        <p-table #dataTable sortMode="multiple" (onLazyLoad)="list($event)"
                            [value]="primengTableHelper.records"
                            rows="{{ primengTableHelper.defaultRecordsCountPerPage }}" [paginator]="false" [lazy]="true"
                            [tableStyle]="{ 'min-width': '50rem' }">
                            <ng-template pTemplate="header">
                                <tr>
                                    <th>
                                        Date
                                    </th>
                                    <th> Type </th>
                                    <th class="text-right">
                                        Amount
                                    </th>
                                </tr>
                            </ng-template>

                            <ng-template pTemplate="body" let-record="$implicit">
                                <tr>
                                    <td>
                                        <span>{{ record.date | date: 'dd-MM-yyyy'}}</span>
                                    </td>
                                    <td>
                                        <span>{{ record.type }}</span>
                                    </td>
                                    <td class="text-center">
                                        <span>{{ record.amount }}</span>

                                    </td>
                                </tr>
                            </ng-template>
                        </p-table>
                        <div class="primeng-no-data text-center" *ngIf="primengTableHelper.totalRecordsCount == 0">
                            <img src="assets/img/no-data.png" alt="Logo" style="margin-top:20px" />
                        </div>
                        <div class="ui-table-footer"></div>
                    </div>
                    <!--<Primeng-TurboTable-End>-->
                </div>
                <div class="card-footer table-card-footer bg-white border-top">
                    <div class="row">
                        <div class="col-sm-4 col-12 text-sm-left text-center">
                            <button class="btn btn-secondary" (click)="refresh()">
                                <i class="fas fa-redo-alt"></i>
                            </button>
                        </div>
                        <div class="col-sm-8 col-12">
                            <div class="float-sm-right m-auto">
                                <div class="primeng-paging-container">
                                    <p-paginator [rows]="primengTableHelper.defaultRecordsCountPerPage" #paginator
                                        (onPageChange)="list($event)"
                                        [totalRecords]="primengTableHelper.totalRecordsCount"
                                        [rowsPerPageOptions]="primengTableHelper.predefinedRecordsCountPerPage"
                                        [showCurrentPageReport]="true" [currentPageReportTemplate]="
                         'TotalRecordsCount'
                          | localize : primengTableHelper.totalRecordsCount
                      "></p-paginator>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
