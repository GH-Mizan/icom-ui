<form class="form-horizontal" autocomplete="off" #productEtryModal="ngForm" (ngSubmit)="save()">
    <abp-modal-header [title]="model.id ? 'Edit Product' : 'Create Product'" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body" *ngIf="!loading">
        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="name">{{ "Name" | localize }}</label>
            <div class="col-md-9">
                <input type="text" class="form-control" name="name" id="name" required [(ngModel)]="model.productName"
                    #nameModel="ngModel" #nameEl />
                <abp-validation-summary [control]="nameModel" [controlEl]="nameEl"></abp-validation-summary>
            </div>
        </div>
        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="description">Description</label>
            <div class="col-md-9">
                <input type="text" class="form-control" name="description" id="description" 
                    [(ngModel)]="model.description" />
            </div>
        </div>

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="brand"> Brand </label>
            <div class="col-md-9">
                <select class="form-select form-control" name="brand" id="brand" #brandModel="ngModel"
                    #brandEl [(ngModel)]="model.brandId">
                    <option *ngFor="let b of brands" [value]="b.value">{{b.displayText}}
                    </option>
                </select>
                <abp-validation-summary [control]="brandModel"
                    [controlEl]="brandEl"></abp-validation-summary>
            </div>
        </div>

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="category"> Category </label>
            <div class="col-md-9">
                <select class="form-select form-control" name="category" id="category" #categoryModel="ngModel"
                    #categoryEl [(ngModel)]="model.categoryId">
                    <option *ngFor="let c of categories" [value]="c.value">{{c.displayText}}
                    </option>
                </select>
                <abp-validation-summary [control]="categoryModel"
                    [controlEl]="categoryEl"></abp-validation-summary>
            </div>
        </div>

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="supplier"> Supplier </label>
            <div class="col-md-9">
                <select class="form-select form-control" name="supplier" id="supplier" #supplierModel="ngModel"
                    #supplierEl [(ngModel)]="model.supplierId">
                    <option *ngFor="let s of suppliers" [value]="s.value">{{s.displayText}}
                    </option>
                </select>
                <abp-validation-summary [control]="supplierModel"
                    [controlEl]="supplierEl"></abp-validation-summary>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="remarks">Remarks</label>
            <div class="col-md-9">
                <textarea class="form-control" name="remarks" id="remarks" [(ngModel)]="model.remarks"></textarea>
            </div>
        </div>

    </div>
    <abp-modal-footer [cancelDisabled]="saving" [saveDisabled]="!productEtryModal.form.valid || saving"
        (onCancelClick)="bsModalRef.hide()"></abp-modal-footer>
</form>
