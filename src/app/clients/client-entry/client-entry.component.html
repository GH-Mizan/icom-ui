<form class="form-horizontal" autocomplete="off" #entryModal="ngForm" (ngSubmit)="save()">
    <abp-modal-header [title]="model.id ? 'Edit Client' : 'Create Client'" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body" *ngIf="!loading">

        <div class="form-group row required">
            <label class="col-md-3 col-form-label">Date</label>
            <div class="col-md-9">
                <p-datepicker [(ngModel)]="date" [ngModelOptions]="{standalone: true}" [readonlyInput]="true" dateFormat="dd/M/yy" [showIcon]="true"  /> 
            </div>
        </div>

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="name">{{ "Name" | localize }}</label>
            <div class="col-md-9">
                <input type="text" class="form-control" name="name" id="name" required [(ngModel)]="model.name"
                    #nameModel="ngModel" #nameEl />
                <abp-validation-summary [control]="nameModel" [controlEl]="nameEl"></abp-validation-summary>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="contactNumber">Contact Number</label>
            <div class="col-md-9">
                <input type="text" class="form-control" name="contactNumber" id="contactNumber" 
                    [(ngModel)]="model.contactNumber" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="whatsAppNumber">WhatsApp Number</label>
            <div class="col-md-9">
                <input type="text" class="form-control" name="whatsAppNumber" id="whatsAppNumber" 
                    [(ngModel)]="model.whatsAppNumber" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="email">Email</label>
            <div class="col-md-9">
                <input type="text" class="form-control" name="email" id="email" 
                    [(ngModel)]="model.email" />
            </div>
        </div>

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="address">Address</label>
            <div class="col-md-9">
                <input type="text" class="form-control" name="address" id="address" 
                    [(ngModel)]="model.address" />
            </div>
        </div>

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="type"> Type </label>
            <div class="col-md-9">
                <select class="form-select form-control" name="type" id="type" #typeModel="ngModel"
                    #typeEl [(ngModel)]="model.type" required>
                    <option *ngFor="let s of clientTypes" [value]="s.value">{{s.displayText}}
                    </option>
                </select>
                <abp-validation-summary [control]="typeModel"
                    [controlEl]="typeEl"></abp-validation-summary>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="remarks">Remarks</label>
            <div class="col-md-9">
                <textarea class="form-control" name="remarks" id="remarks" [(ngModel)]="model.remarks"></textarea>
            </div>
        </div>

    </div>
    <abp-modal-footer [cancelDisabled]="saving" [saveDisabled]="!entryModal.form.valid || saving"
        (onCancelClick)="bsModalRef.hide()"></abp-modal-footer>
</form>
