<div [@routerTransition]>
  <section class="content-header">
    <div class="container-fluid">
      <div class="row">
        <div class="col-6">
          <h1>Attendances</h1>
        </div>
        <div class="col-6 text-right">
          <a href="javascript:;" class="btn bg-blue" (click)="create()">
            <i class="fa fa-plus-square"></i>
          </a>
        </div>
      </div>
    </div>
  </section>
  <section class="content px-2 pb-3">
    <div class="container-fluid">
      <div class="card table-wrapper">
        <div class="card-header">
          <div class="row">
            <div class="col-lg-4 col-md-4 col-sm-12">
              <div class="input-group">
                <div class="input-group-prepend">
                  <button type="button" class="btn bg-blue" (click)="list()">
                    <i class="fas fa-search"></i>
                  </button>
                </div>
                <input type="text" class="form-control" name="keyword" placeholder="Search..." [(ngModel)]="searchText"
                  (keyup.enter)="list()" />

              </div>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-12">
              <div class="form-group row">
                <label class="col-3 col-form-label" for="client">Student</label>
                <div class="col-9">
                  <p-select [options]="students" [(ngModel)]="selectedStudent" optionLabel="name" [filter]="true"
                    filterBy="displayText" [showClear]="true" placeholder="" class="w-full w-100" name="student"
                    id="student" (ngModelChange)="list()">
                    <ng-template #selectedItem let-selectedOption>
                      <div class="flex items-center gap-2">
                        <div>{{ selectedOption.displayText }}</div>
                      </div>
                    </ng-template>
                    <ng-template let-client #item>
                      <div class="flex items-center gap-2">
                        <div>{{ client.displayText }}</div>
                      </div>
                    </ng-template>
                  </p-select>
                </div>
              </div>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-12">
              <div class="form-group row required">
                <label class="col-md-3 col-form-label"> Date </label>
                <div class="col-md-9">
                  <p-datepicker [(ngModel)]="date" [readonlyInput]="true" dateFormat="dd/M/yy" [showIcon]="true"
                    [showClear]="true" (ngModelChange)="list()" />
                </div>
              </div>
            </div>

          </div>

          <div class="row">
            <div class="col-lg-4 col-md-4 col-sm-12">
              <div class="form-group row">
                <label class="col-md-3 col-form-label"> BTEB </label>
                <div class="col-md-9">
                  <select class="form-select form-control" [(ngModel)]="isBteb" (ngModelChange)="list()">
                    <option [value]="undefined">All</option>
                    <option [value]="true">Yes</option>
                    <option [value]="false">No</option>
                  </select>
                </div>
              </div>

            </div>

            <div class="col-lg-4 col-md-4 col-sm-12">
              <div class="form-group row">
                <label class="col-md-3 col-form-label"> Active Only </label>
                <div class="col-md-9">
                  <select class="form-select form-control" [(ngModel)]="activeOnly" (ngModelChange)="list()">
                    <option [value]="true">Yes</option>
                    <option [value]="false">No</option>
                  </select>
                </div>
              </div>

            </div>

            <div class="col-lg-4 col-md-4 col-sm-12">
              <div class="form-group row">
                <label class="col-md-3 col-form-label"> Present </label>
                <div class="col-md-9">
                  <select class="form-select form-control" [(ngModel)]="present" (ngModelChange)="list()">
                    <option [value]="undefined">All</option>
                    <option [value]="true">Yes</option>
                    <option [value]="false">No</option>
                  </select>
                </div>
              </div>

            </div>
            
          </div>







          <!-- <div class="row">
            <div class="col-md-6">
              <div class="form-group row required">
                <label class="col-md-3 col-form-label"> Date </label>
                <div class="col-md-9">
                  <p-datepicker [(ngModel)]="date" [readonlyInput]="true" dateFormat="dd/M/yy" [showIcon]="true"
                    (ngModelChange)="list()" />
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="input-group">
                <div class="input-group-prepend">
                  <button type="button" class="btn bg-blue" (click)="list()">
                    <i class="fas fa-search"></i>
                  </button>
                </div>
                <input type="text" class="form-control" name="keyword" placeholder="Search..." [(ngModel)]="searchText"
                  (keyup.enter)="list()" />

              </div>
            </div>
          </div> -->

        </div>
        <div class="card-body table-responsive table-striped table-bordered">
          <!--<Primeng-TurboTable-Start>-->
          <div class="primeng-datatable-container">
            <p-table #dataTable sortMode="multiple" (onLazyLoad)="list($event)" [value]="primengTableHelper.records"
              rows="{{ primengTableHelper.defaultRecordsCountPerPage }}" [paginator]="false" [lazy]="true"
              [tableStyle]="{ 'min-width': '50rem' }">
              <ng-template pTemplate="header">
                <tr>
                  <th> Date </th>
                  <th> Student Name </th>
                  <th> BTEB </th>
                  <th> Day </th>
                  <th> Present </th>
                  <th> Remarks </th>
                  <th class="text-center">
                    Actions
                  </th>
                </tr>
              </ng-template>

              <ng-template pTemplate="body" let-record="$implicit">
                <tr>
                  <td>
                    <span>{{ record.date | date: 'dd-MM-yyyy' }}</span>
                  </td>
                  <td>
                    <span>{{ record.studentName }}</span>
                  </td>
                  <td>
                    <span>{{ record.bteb }}</span>
                  </td>
                  <td>
                    <span>{{ record.day }}</span>
                  </td>
                  <td>
                    <input class="form-check-input chkBig" type="checkbox" value="" [id]="record.id"
                      [checked]="record.present" [(ngModel)]="record.present">
                  </td>
                  <td>
                    <span>{{ record.remarks }}</span>
                  </td>
                  <td class="text-center">
                    <button type="button" class="btn btn-sm bg-secondary" (click)="edit(record.id)">
                      <i class="fas fa-pencil-alt"></i>
                    </button>
                    <!-- <button type="button" class="btn btn-sm bg-success" (click)="openCustomerPriceModal(record)">
                      <i class="fas fa-file-invoice-dollar"></i>
                    </button> -->

                  </td>
                </tr>
              </ng-template>
            </p-table>
            <div class="primeng-no-data text-center" *ngIf="primengTableHelper.totalRecordsCount == 0">
              <img src="assets/img/no-data.png" alt="Logo" style="margin-top:20px" />
            </div>
            <div class="ui-table-footer"></div>
          </div>
          <!--<Primeng-TurboTable-End>-->
        </div>
        <div class="card-footer table-card-footer bg-white border-top">
          <div class="row">
            <div class="col-sm-4 col-12 text-sm-left text-center">
              <button class="btn btn-secondary" (click)="refresh()">
                <i class="fas fa-redo-alt"></i>
              </button>
            </div>
            <div class="col-sm-8 col-12">
              <div class="float-sm-right m-auto">
                <div class="primeng-paging-container">
                  <p-paginator [rows]="primengTableHelper.defaultRecordsCountPerPage" #paginator
                    (onPageChange)="list($event)" [totalRecords]="primengTableHelper.totalRecordsCount"
                    [rowsPerPageOptions]="primengTableHelper.predefinedRecordsCountPerPage"
                    [showCurrentPageReport]="true" [currentPageReportTemplate]="
                         'TotalRecordsCount'
                          | localize : primengTableHelper.totalRecordsCount
                      "></p-paginator>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
