<abp-modal-header [title]="editMode ? 'Edit Attendances' : 'Create Attendances'"
    (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
<div class="modal-body">

    <div class="card table-wrapper">
        <div class="card-header">
            <div class="row">
                <div class="col-lg-4 col-md-4 col-sm-12">
                    <div class="form-group row required">
                        <label class="col-md-3 col-form-label"> Date </label>
                        <div class="col-md-9">
                            <p-datepicker [(ngModel)]="date" [readonlyInput]="true" dateFormat="dd/M/yy"
                                [showIcon]="true" />
                        </div>
                    </div>
                </div>
                <div class="col-lg-5 col-md-5 col-sm-12">
                    <div class="form-group row">
                        <label class="col-md-3 col-form-label"> Course </label>
                        <div class="col-md-9">

                        </div>
                    </div>
                </div>

                <div class="col-lg-3 col-md-3 col-sm-12">
                    <div class="form-group row">
                        <button type="button" class="btn btn-primary" (click)="print()"> Print </button>
                        <button type="button" class="btn btn-success mx-1" (click)="save()"> Save </button>
                    </div>
                </div>
            </div>
            <div class="row" *ngIf="!editMode">
                <div class="col-lg-4 col-md-4 col-sm-12">
                    <div class="form-group row">
                        <label class="col-md-8 col-form-label"> Declare Off Day </label>
                        <div class="col-md-4">
                            <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" name="offDay" id="offDay"
                                    [(ngModel)]="declareOffDay" />
                                <label class="custom-control-label mt-2" for="offDay"></label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8 col-md-8 col-sm-12">
                    <div class="form-group row">
                        <label class="col-md-2 col-form-label"> Reason </label>
                        <div class="col-md-10">
                            <input type="text" class="form-control" name="reason" id="reason"
                                    [(ngModel)]="offDayReason" />
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="row">
        <div class="table-responsive table-striped table-bordered">
            <!--<Primeng-TurboTable-Start>-->
            <div class="primeng-datatable-container">
                <p-table #dataTable [value]="attendances" rows="20" [paginator]="false" [lazy]="true"
                    [tableStyle]="{ 'min-width': '35rem' }">
                    <ng-template pTemplate="header">
                        <tr>
                            <th> SL <br /> ID <br /> Name </th>
                            <th> Is BTEB <br /> Day <br /> Session </th>
                            <th> Entry Time <br /> Exit Time </th>
                            <th> Attandance </th>
                            <th> Remarks </th>
                        </tr>
                    </ng-template>

                    <ng-template pTemplate="body" let-record="$implicit" let-rowIndex="rowIndex">
                        <tr>
                            <td>
                                <span> {{rowIndex + 1}} <br /> {{ record.identityNumber }} <br /> {{ record.studentName
                                    }}</span>
                            </td>
                            <td>
                                <span>{{ record.bteb }} <br /> {{record.day}} <br /> {{ record.btebSession }}</span>
                            </td>
                            <td>
                                <span><p-datepicker inputId="calendar-timeonly" [(ngModel)]="record.entryTime"
                                        [timeOnly]="true" [hourFormat]="12" /> <br />
                                    <p-datepicker inputId="calendar-timeonly" [(ngModel)]="record.endTime"
                                        [timeOnly]="true" [hourFormat]="12" />
                                </span>
                            </td>
                            <td>
                                <div class="text-center">
                                    <input class="form-check-input chkBig" type="checkbox" value="" [id]="record.id"
                                        [checked]="record.present" [(ngModel)]="record.present">
                                </div>
                            </td>
                            <td class="text-right">
                                <span>{{ record.remarks }}</span>
                            </td>
                        </tr>
                    </ng-template>

                    <ng-template pTemplate="footer">

                    </ng-template>
                </p-table>
                <div class="primeng-no-data text-center" *ngIf="attendances.length == 0">
                    <img src="assets/img/no-data.png" alt="Logo" style="margin-top:20px" />
                </div>
            </div>
            <!--<Primeng-TurboTable-End>-->
        </div>
    </div>


</div>
<!-- <abp-modal-footer [cancelDisabled]="saving" [saveDisabled]="!entryModal.form.valid || saving"
        (onCancelClick)="bsModalRef.hide()"></abp-modal-footer> -->
