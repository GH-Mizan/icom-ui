<form class="form-horizontal" autocomplete="off" #entryModal="ngForm" (ngSubmit)="save()">
    <abp-modal-header title="Create/Edit Service Expense" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body">
        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="name">Date</label>
            <div class="col-md-9">
                <p-datepicker [(ngModel)]="date" [ngModelOptions]="{standalone: true}" [readonlyInput]="true" dateFormat="dd/M/yy" [showIcon]="true"  />
            </div>
        </div>

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="type"> Type </label>
            <div class="col-md-9">
                <select class="form-select form-control" name="type" id="type" #typeModel="ngModel"
                    #typeEl [(ngModel)]="model.type" required>
                    <option *ngFor="let t of serviceExpenseTypes" [value]="t.value">{{t.displayText}}
                    </option>
                </select>
                <abp-validation-summary [control]="typeModel" [controlEl]="typeEl"></abp-validation-summary>
            </div>
        </div>

         <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="value">Amount</label>
            <div class="col-md-9">
                <input type="number" class="form-control" name="value" id="value" required [(ngModel)]="model.amount"
                    #valueModel="ngModel" #valueEl />
                <abp-validation-summary [control]="valueModel" [controlEl]="valueEl"></abp-validation-summary>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="remarks">Remarks</label>
            <div class="col-md-9">
                <input type="text" class="form-control" name="remarks" id="remarks" [(ngModel)]="model.remarks" />
            </div>
        </div>

    </div>
    <abp-modal-footer [cancelDisabled]="saving" [saveDisabled]="!entryModal.form.valid || saving"
        (onCancelClick)="bsModalRef.hide()"></abp-modal-footer>
</form>
