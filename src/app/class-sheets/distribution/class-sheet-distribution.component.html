<div [@routerTransition]>
    <section class="content-header">
        <div class="container-fluid">
            <div class="row">
                <div class="col-6">
                    <h1>Class Sheet Distribution</h1>
                </div>
                <div class="col-6 text-right">
                    <p-select [options]="students" [(ngModel)]="selectedStudent" optionLabel="name" [filter]="true"
                        filterBy="displayText" [showClear]="true" placeholder="" class="w-full w-100" name="student"
                        id="student" (ngModelChange)="list()">
                        <ng-template #selectedItem let-selectedOption>
                            <div class="flex items-center gap-2">
                                <div>{{ selectedOption.displayText }}</div>
                            </div>
                        </ng-template>
                        <ng-template let-student #item>
                            <div class="flex items-center gap-2">
                                <div>{{ student.displayText }}</div>
                            </div>
                        </ng-template>
                    </p-select>
                </div>
            </div>
        </div>
    </section>
    <section class="content px-2 pb-3">
        <div class="container-fluid">
            <div class="card table-wrapper">
                <div class="card-header">
                    <div class="row">
                        <div class="col-md-6">&emsp;</div>
                        <div class="col-md-6">

                        </div>
                    </div>

                </div>
                <div class="card-body table-responsive table-striped table-bordered">
                    <!--<Primeng-TurboTable-Start>-->
                    <div class="primeng-datatable-container">
                        <p-table #dataTable sortMode="multiple" (onLazyLoad)="list($event)"
                            [value]="primengTableHelper.records" [loading]="primengTableHelper.isLoading"
                            rows="{{ primengTableHelper.defaultRecordsCountPerPage }}" [paginator]="false" [lazy]="true"
                            [tableStyle]="{ 'min-width': '50rem' }">
                            <ng-template pTemplate="header">
                                <tr>
                                    <th>
                                        Student Name
                                    </th>
                                    <th> Date </th>
                                    <th> Sheet </th>
                                    <th class="text-center"> Distributed </th>
                                    <th class="text-center">
                                        Actions
                                    </th>
                                </tr>
                            </ng-template>

                            <ng-template pTemplate="body" let-record="$implicit">
                                <tr>
                                    <td>
                                        <span>{{ record.studentName }}</span>
                                    </td>
                                    <td>
                                        <span>{{ record.date | date: 'dd-MM-yyyy' }}</span>
                                    </td>
                                    <td>
                                        <span>{{ record.sheetName }}</span>
                                    </td>
                                    <td>
                                        <div class="text-center">
                                            <input class="form-check-input chkBig" type="checkbox" value=""
                                                [id]="record.id" [checked]="record.distributed"
                                                [(ngModel)]="record.distributed">
                                        </div>
                                    </td>
                                    <td class="text-center">
                                        <button type="button" class="btn btn-sm bg-primary" (click)="save(record)">
                                            <i class="fa fa-save"></i>
                                        </button>
                                        <!-- <button type="button" class="btn btn-sm bg-success" (click)="openCustomerPriceModal(record)">
                      <i class="fas fa-file-invoice-dollar"></i>
                    </button> -->

                                    </td>
                                </tr>
                            </ng-template>
                        </p-table>
                        <div class="primeng-no-data text-center" *ngIf="primengTableHelper.totalRecordsCount == 0">
                            <img src="assets/img/no-data.png" alt="Logo" style="margin-top:20px" />
                        </div>
                        <div class="ui-table-footer"></div>
                    </div>
                    <!--<Primeng-TurboTable-End>-->
                </div>
                <div class="card-footer table-card-footer bg-white border-top">
                    <div class="row">
                        <div class="col-sm-4 col-12 text-sm-left text-center">
                            <button class="btn btn-secondary" (click)="refresh()">
                                <i class="fas fa-redo-alt"></i>
                            </button>
                        </div>
                        <div class="col-sm-8 col-12">
                            <div class="float-sm-right m-auto">
                                <div class="primeng-paging-container">
                                    <p-paginator [rows]="primengTableHelper.defaultRecordsCountPerPage" #paginator
                                        (onPageChange)="list($event)"
                                        [totalRecords]="primengTableHelper.totalRecordsCount"
                                        [rowsPerPageOptions]="primengTableHelper.predefinedRecordsCountPerPage"
                                        [showCurrentPageReport]="true" [currentPageReportTemplate]="
                         'TotalRecordsCount'
                          | localize : primengTableHelper.totalRecordsCount
                      "></p-paginator>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
